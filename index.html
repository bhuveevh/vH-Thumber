<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Thumbnail Maker</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css">
    
    <style>
        :root {
            --bg-main: #f0f2f5;
            --bg-panel: #ffffff;
            --bg-canvas-area: #d6dde2;
            --text-primary: #1a2533;
            --text-secondary: #5a6a7a;
            --border-color: #e0e5ea;
            --primary-accent: #007bff;
            --success-accent: #28a745;
            --danger-accent: #dc3545;
            --input-bg: #ffffff;
        }
        
        body.dark-theme {
            --bg-main: #1a202c;
            --bg-panel: #2d3748;
            --bg-canvas-area: #283141;
            --text-primary: #f7fafc;
            --text-secondary: #a0aec0;
            --border-color: #4a5568;
            --input-bg: #4a5568;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Poppins', sans-serif; background-color: var(--bg-main); color: var(--text-primary); display: flex; height: 100vh; overflow: hidden; transition: background-color 0.3s, color 0.3s; }
        .app-container { display: flex; flex-direction: column; width: 100%; height: 100%; }
        .top-header { display: flex; align-items: center; padding: 10px 15px; background-color: var(--bg-panel); border-bottom: 1px solid var(--border-color); gap: 15px; flex-shrink: 0; flex-wrap: wrap; transition: background-color 0.3s, border-color 0.3s; }
        .header-title { font-weight: 600; color: var(--text-secondary); margin-right: 10px; font-size: 0.9rem; align-self: center; }
        .tool-section, .canvas-settings-section, .history-section { display: flex; align-items: center; gap: 10px; border-right: 1px solid var(--border-color); padding-right: 15px; transition: border-color 0.3s;}
        .top-header .right-aligned-tools { margin-left: auto; display: flex; align-items: center; gap: 15px; }
        .main-content { display: flex; flex-grow: 1; overflow: hidden; }
        .panel { background-color: var(--bg-panel); display: flex; flex-direction: column; transition: background-color 0.3s, border-color 0.3s; }
        .left-panel { flex: 0 0 280px; border-right: 1px solid var(--border-color); }
        .right-panel { flex: 0 0 260px; border-left: 1px solid var(--border-color); }
        .panel h3 { padding: 15px; border-bottom: 1px solid var(--border-color); font-size: 1rem; flex-shrink: 0; transition: border-color 0.3s; }
        .scroll-container, .layer-list { overflow-y: auto; flex-grow: 1; }
        .control-group { padding: 15px; border-bottom: 1px solid var(--border-color); transition: border-color 0.3s; }
        .panel h4 { font-size: 0.9rem; color: var(--text-secondary); margin-bottom: 15px; }
        label { font-size: 0.85rem; margin-bottom: 10px; display: block; }
        input, select, textarea { width: 100%; padding: 8px; border: 1px solid var(--border-color); border-radius: 4px; font-size: 0.9rem; background-color: var(--input-bg); color: var(--text-primary); transition: background-color 0.3s, color 0.3s, border-color 0.3s; }
        input[type="color"] { height: 35px; padding: 2px; }
        .tool-btn, .download-btn, .danger-btn { padding: 8px 12px; border-radius: 5px; border: 1px solid var(--border-color); cursor: pointer; font-size: 0.9rem; transition: all 0.2s; display: inline-flex; align-items: center; gap: 8px; background-color: #f8f9fa; }
        body.dark-theme .tool-btn, body.dark-theme .danger-btn { background-color: #4a5568; color: var(--text-primary); border-color: #718096; }
        body.dark-theme .tool-btn:hover { background-color: #718096; }
        #add-rect-btn, #add-circle-btn, #undo-btn, #redo-btn, #delete-btn-header { padding: 8px 15px; }
        .tool-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .download-btn { background-color: var(--success-accent); color: white; border: none; }
        .danger-btn { background-color: #f8f9fa; color: var(--danger-accent); border: 1px solid var(--border-color); }
        .danger-btn:hover { background-color: var(--danger-accent); color: white; }
        body.dark-theme .danger-btn { background-color: #4a5568; color: var(--danger-accent); border-color: var(--danger-accent); }
        body.dark-theme .danger-btn:hover { background-color: var(--danger-accent); color: white; }
        .inline-controls { display: flex; gap: 5px; }
        .inline-controls button { flex-grow: 1; padding: 8px; background: #f0f0f0; border: 1px solid #ccc; border-radius: 4px; }
        body.dark-theme .inline-controls button { background-color: #4a5568; border-color: #718096; color: var(--text-primary); }
        .inline-controls button.active { background-color: var(--primary-accent); color: white; }
        
        /* UPDATED: Canvas wrapper is now a column flex container */
        #canvas-wrapper {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: var(--bg-canvas-area);
            transition: background-color 0.3s;
            gap: 20px; /* Space between canvas and notebook */
        }
        
        canvas { box-shadow: 0 5px 25px rgba(0,0,0,0.15); }
        .layer-item { display: flex; align-items: center; padding: 8px 10px; font-size: 0.9rem; border-bottom: 1px solid var(--border-color); user-select: none; transition: background-color 0.2s, border-color 0.3s; }
        .layer-item.selected { background-color: var(--primary-accent); color: white; }
        body.dark-theme .layer-item.selected { background-color: #4299e1; }
        body.dark-theme .layer-item.selected .layer-actions button { color: white; }
        .layer-item span { flex-grow: 1; margin: 0 8px; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .layer-actions { display: flex; align-items: center; }
        .layer-actions button { background: none; border: none; cursor: pointer; color: var(--text-secondary); padding: 5px; border-radius: 3px; }
        .layer-actions button:hover { background-color: #eee; }
        body.dark-theme .layer-actions button:hover { background-color: #4a5568; }
        .layer-lock-btn .fa-lock { color: var(--danger-accent); }
        .layer-ordering { display: flex; flex-direction: column; margin-right: 5px; }
        .layer-ordering button { padding: 0 5px; font-size: 0.8rem; line-height: 1; height: 16px; }
        .placeholder-text { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100%; color: #aaa; text-align: center; padding: 20px; }
        #custom-size-inputs { display: flex; align-items: center; gap: 5px; }
        #custom-size-inputs input { width: 70px; }
        .theme-switch-wrapper { display: flex; align-items: center; }
        .theme-switch { display: inline-block; height: 24px; position: relative; width: 50px; }
        .theme-switch input { display: none; }
        .slider { background-color: #ccc; bottom: 0; cursor: pointer; left: 0; position: absolute; right: 0; top: 0; transition: .4s; }
        .slider:before { background-color: #fff; bottom: 4px; content: ""; height: 16px; left: 4px; position: absolute; transition: .4s; width: 16px; }
        input:checked + .slider { background-color: var(--primary-accent); }
        input:checked + .slider:before { transform: translateX(26px); }
        .slider.round { border-radius: 34px; }
        .slider.round:before { border-radius: 50%; }
        
        /* UPDATED: Notebook Panel Styles */
        .notebook-panel {
            width: 100%;
            max-width: 854px; /* Same as canvas max-width for alignment */
            flex-shrink: 0;
        }
        #notebook-textarea {
            resize: none;
            font-family: monospace;
            line-height: 1.5;
            background-color: var(--bg-panel);
            border-color: var(--border-color);
        }
        
        /* Modal and Loader styles */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 1000; }
        .loader-overlay { background: rgba(255, 255, 255, 0.7); }
        body.dark-theme .loader-overlay { background: rgba(0,0,0,0.7); }
        .loader-overlay p { color: var(--text-primary); margin-top: 15px; }
        .modal-content { background-color: var(--bg-panel); padding: 25px; border-radius: 8px; width: 90%; max-width: 600px; position: relative; }
        .modal-close-btn { position: absolute; top: 10px; right: 15px; background: none; border: none; font-size: 2rem; cursor: pointer; color: #aaa; }
        .modal-body { display: flex; gap: 20px; margin-top: 20px; flex-wrap: wrap; }
        .modal-preview { flex-basis: 250px; flex-grow: 1; text-align: center; }
        .modal-preview img { max-width: 100%; border: 1px solid var(--border-color); }
        .modal-options { flex-basis: 250px; flex-grow: 1; }
        .modal-footer { width: 100%; text-align: right; margin-top: 25px; }
        .info { font-size: 0.8rem; color: #777; margin-top: 10px; }
        .loader { border: 5px solid #f3f3f3; border-radius: 50%; border-top: 5px solid var(--primary-accent); width: 50px; height: 50px; animation: spin 1s linear infinite; }
        body.dark-theme .loader { border-color: #4a5568; border-top-color: var(--primary-accent); }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .hidden { display: none !important; }
        .layer-item[draggable="true"] { cursor: grab; }
        .layer-item.dragging { opacity: 0.5; background: #cce5ff; }
    </style>
    
    <style id="custom-fonts-style"></style>
</head>
<body>
    
    <div id="app-loader" class="loader-overlay hidden">
        <div class="loader"></div>
        <p id="loader-text">Processing...</p>
    </div>

    <div class="app-container">
        <!-- TOP HEADER -->
        <header class="top-header">
            <div class="tool-section">
                <span class="header-title">Create</span>
                <button id="add-text-btn" class="tool-btn" title="Add Text"><i class="fas fa-font"></i> Text</button>
                <button id="add-rect-btn" class="tool-btn" title="Add Rectangle"><i class="fas fa-square"></i></button>
                <button id="add-circle-btn" class="tool-btn" title="Add Circle"><i class="fas fa-circle"></i></button>
                <label for="image-upload" class="tool-btn" title="Upload Image"><i class="fas fa-image"></i> Image</label>
                <input type="file" id="image-upload" style="display: none;" accept="image/*">
                <label for="font-upload" class="tool-btn" title="Upload Font(s)"><i class="fas fa-plus"></i> Font</label>
                <input type="file" id="font-upload" style="display: none;" accept=".ttf,.otf,.woff,.woff2" multiple>
            </div>
             <div class="history-section">
                <button id="undo-btn" class="tool-btn" title="Undo (Ctrl+Z)"><i class="fas fa-undo"></i></button>
                <button id="redo-btn" class="tool-btn" title="Redo (Ctrl+Y)"><i class="fas fa-redo"></i></button>
                <button id="delete-btn-header" class="tool-btn danger-btn" title="Delete (Del)"><i class="fas fa-trash"></i></button>
            </div>
            <div class="canvas-settings-section">
                 <span class="header-title">Canvas</span>
                <select id="canvas-size"></select>
                <div id="custom-size-inputs" class="hidden">
                    <input type="number" id="custom-width-input" value="1280">
                    <span>×</span>
                    <input type="number" id="custom-height-input" value="720">
                </div>
                <input type="color" id="canvas-bg-color" value="#333333" title="Background Color">
            </div>
            <div class="right-aligned-tools">
                <div class="theme-switch-wrapper">
                    <label class="theme-switch" for="theme-toggle">
                        <input type="checkbox" id="theme-toggle" />
                        <div class="slider round"></div>
                    </label>
                </div>
                <button id="open-download-modal-btn" class="download-btn"><i class="fas fa-download"></i> Download</button>
            </div>
        </header>

        <!-- MAIN CONTENT -->
        <main class="main-content">
            <aside id="properties-panel" class="panel left-panel">
                <h3><i class="fas fa-cogs"></i> Properties</h3>
                <div id="properties-content" class="scroll-container hidden">
                    <div id="text-controls" class="control-group hidden">
                        <h4>Text Style</h4>
                        <label>Font: <select id="font-family"></select></label>
                        <label>Size: <input type="number" id="font-size" value="40" min="1"></label>
                        <div class="inline-controls">
                            <button id="font-bold" title="Bold">B</button>
                            <button id="font-italic" title="Italic">I</button>
                            <button id="font-underline" title="Underline">U</button>
                        </div>
                        <label>Alignment:</label>
                        <div class="inline-controls">
                            <button id="align-left" title="Align Left"><i class="fas fa-align-left"></i></button>
                            <button id="align-center" title="Align Center"><i class="fas fa-align-center"></i></button>
                            <button id="align-right" title="Align Right"><i class="fas fa-align-right"></i></button>
                        </div>
                        <label>Line Height: <input type="range" id="line-height" min="0.5" max="3" step="0.1" value="1.2"></label>
                        <label>Letter Spacing: <input type="range" id="char-spacing" min="-100" max="500" value="0"></label>
                    </div>
                    <div id="common-controls" class="control-group">
                         <h4>Fill & Stroke</h4>
                        <label>Fill: <input type="color" id="fill-color"></label>
                        <label>Stroke: <input type="color" id="stroke-color"></label>
                        <label>Stroke Width: <input type="range" id="stroke-width" min="0" max="30" value="0"></label>
                    </div>
                    <div id="shape-controls" class="control-group hidden">
                        <h4>Shape</h4>
                        <label>Corner Smoothness (%): <input type="range" id="corner-radius" min="0" max="100" value="0"></label>
                    </div>
                     <div id="shadow-controls" class="control-group">
                        <h4>Shadow</h4>
                        <label>Color: <input type="color" id="shadow-color"></label>
                        <label>Blur: <input type="range" id="shadow-blur" min="0" max="50" value="0"></label>
                        <label>Offset X: <input type="range" id="shadow-offset-x" min="-50" max="50" value="0"></label>
                        <label>Offset Y: <input type="range" id="shadow-offset-y" min="-50" max="50" value="0"></label>
                    </div>
                    <div class="control-group">
                        <h4>General</h4>
                        <label>Opacity: <input type="range" id="opacity" min="0" max="1" step="0.05" value="1"></label>
                    </div>
                </div>
                <div id="properties-placeholder" class="placeholder-text">
                    <i class="fas fa-mouse-pointer fa-3x"></i>
                    <p>Select an object to edit.</p>
                </div>
            </aside>
            <!-- UPDATED: Notebook is now inside the canvas wrapper -->
            <div id="canvas-wrapper">
                <canvas id="thumbnail-canvas"></canvas>
                <div class="notebook-panel">
                    <textarea id="notebook-textarea" rows="4" placeholder="Your notes here..."></textarea>
                </div>
            </div>
            <aside id="layers-panel" class="panel right-panel">
                 <h3><i class="fas fa-layer-group"></i> Layers</h3>
                <ul id="layer-list" class="layer-list"></ul>
            </aside>
        </main>
        
        <!-- REMOVED: Notebook footer from here -->
    </div>

    <!-- DOWNLOAD MODAL (No changes) -->
    <div id="download-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <button class="modal-close-btn">×</button>
            <h3>Download Thumbnail</h3>
            <div class="modal-body">
                <div class="modal-preview"><p>Preview</p><img id="download-preview-img" src=""></div>
                <div class="modal-options">
                    <label>Format:<select id="download-format"><option value="jpeg">JPEG</option><option value="png">PNG</option><option value="webp">WebP</option></select></label>
                    <label id="size-control">Target Size (KB):<input type="number" id="download-target-size" value="150" min="10"></label>
                    <p class="info">Note: Final size is an approximation. PNG is a lossless format.</p>
                </div>
            </div>
            <div class="modal-footer"><button id="final-download-btn" class="download-btn">Download Now</button></div>
        </div>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // --- DOM Elements (No major changes) ---
            const appLoader = document.getElementById('app-loader'), loaderText = document.getElementById('loader-text');
            const propertiesPanelContent = document.getElementById('properties-content'), propertiesPlaceholder = document.getElementById('properties-placeholder');
            const canvasWrapper = document.getElementById('canvas-wrapper'), canvasSizeSelect = document.getElementById('canvas-size');
            const customSizeInputs = document.getElementById('custom-size-inputs'), customWidthInput = document.getElementById('custom-width-input'), customHeightInput = document.getElementById('custom-height-input');
            const canvasBgColorInput = document.getElementById('canvas-bg-color'), layerList = document.getElementById('layer-list');
            const addTextBtn = document.getElementById('add-text-btn'), addRectBtn = document.getElementById('add-rect-btn'), addCircleBtn = document.getElementById('add-circle-btn');
            const imageUpload = document.getElementById('image-upload'), fontUpload = document.getElementById('font-upload');
            const undoBtn = document.getElementById('undo-btn'), redoBtn = document.getElementById('redo-btn'), deleteBtnHeader = document.getElementById('delete-btn-header');
            const textControls = document.getElementById('text-controls'), shapeControls = document.getElementById('shape-controls');
            const fillColorInput = document.getElementById('fill-color'), strokeColorInput = document.getElementById('stroke-color'), strokeWidthInput = document.getElementById('stroke-width');
            const opacityInput = document.getElementById('opacity'), cornerRadiusInput = document.getElementById('corner-radius');
            const shadowColorInput = document.getElementById('shadow-color'), shadowBlurInput = document.getElementById('shadow-blur'), shadowOffsetXInput = document.getElementById('shadow-offset-x'), shadowOffsetYInput = document.getElementById('shadow-offset-y');
            const fontFamilySelect = document.getElementById('font-family'), fontSizeInput = document.getElementById('font-size');
            const fontBoldBtn = document.getElementById('font-bold'), fontItalicBtn = document.getElementById('font-italic'), fontUnderlineBtn = document.getElementById('font-underline');
            const alignLeftBtn = document.getElementById('align-left'), alignCenterBtn = document.getElementById('align-center'), alignRightBtn = document.getElementById('align-right');
            const lineHeightInput = document.getElementById('line-height'), charSpacingInput = document.getElementById('char-spacing');
            const openDownloadModalBtn = document.getElementById('open-download-modal-btn'), downloadModal = document.getElementById('download-modal'), modalCloseBtn = document.querySelector('.modal-close-btn');
            const previewImg = document.getElementById('download-preview-img'), formatSelect = document.getElementById('download-format'), sizeControl = document.getElementById('size-control');
            const targetSizeInput = document.getElementById('download-target-size'), finalDownloadBtn = document.getElementById('final-download-btn');
            const themeToggle = document.getElementById('theme-toggle');

            let canvas, history = [], historyIndex = -1, historyLock = false;
            let savedFonts = [], draggedItem = null;

            const CANVAS_RESOLUTIONS = {
                "1280x720": "HD (1280x720)", "854x480": "480p (854x480)",
                "640x415": "Blog (640x415)", "640x360": "360p (640x360)",
                "custom": "Custom Size"
            };
            
            const showLoader = (text) => { loaderText.textContent = text; appLoader.classList.remove('hidden'); };
            const hideLoader = () => appLoader.classList.add('hidden');
            const updateProp = (prop, value) => canvas.getActiveObjects().forEach(obj => obj.set(prop, value));
            const render = () => canvas.renderAll();

            function saveState() { if (historyLock) return; history = history.slice(0, historyIndex + 1); history.push(canvas.toJSON(['cornerPercent', 'originalName'])); historyIndex = history.length - 1; updateHistoryButtons(); }
            function loadState(state) { historyLock = true; canvas.loadFromJSON(state, () => { canvas.getObjects().forEach(obj => { if (obj.isType('rect') && typeof obj.cornerPercent !== 'undefined') { updateProportionalCorners(obj, obj.cornerPercent); } }); canvas.renderAll(); historyLock = false; updateUI(); }); }
            function undo() { if (historyIndex > 0) { historyIndex--; loadState(history[historyIndex]); } updateHistoryButtons(); }
            function redo() { if (historyIndex < history.length - 1) { historyIndex++; loadState(history[historyIndex]); } updateHistoryButtons(); }
            function updateHistoryButtons() { undoBtn.disabled = historyIndex <= 0; redoBtn.disabled = historyIndex >= history.length - 1; }
            function injectFontFace(fontName, fontDataUrl) { const customFontsStyle = document.getElementById('custom-fonts-style'); const newFontFace = `@font-face { font-family: "${fontName}"; src: url(${fontDataUrl}); }\n`; if (!customFontsStyle.innerHTML.includes(`font-family: "${fontName}"`)) { customFontsStyle.innerHTML += newFontFace; } }
            function updateFontDropdown() { const currentFont = fontFamilySelect.value; fontFamilySelect.innerHTML = ''; ['Arial', 'Verdana', 'Helvetica', ...savedFonts.map(f => f.name)].forEach(font => { const option = new Option(font, font); option.style.fontFamily = `"${font}", sans-serif`; fontFamilySelect.add(option); }); fontFamilySelect.value = currentFont || 'Arial'; }
            async function handleFontUpload(e) { const files = e.target.files; if (!files.length) return; showLoader(`Loading ${files.length} font(s)...`); const promises = Array.from(files).map(file => { return new Promise((resolve, reject) => { const reader = new FileReader(); reader.onload = function(event) { const fontName = file.name.split('.').slice(0, -1).join('.').replace(/[-_]/g, ' '); const fontDataUrl = event.target.result; if (!savedFonts.find(f => f.name === fontName)) { injectFontFace(fontName, fontDataUrl); savedFonts.push({ name: fontName, data: fontDataUrl }); } resolve(); }; reader.onerror = reject; reader.readAsDataURL(file); }); }); await Promise.all(promises); localStorage.setItem('thumbnailMakerFonts', JSON.stringify(savedFonts)); updateFontDropdown(); hideLoader(); e.target.value = ''; }
            function loadSavedFonts() { const storedFonts = JSON.parse(localStorage.getItem('thumbnailMakerFonts')); if (storedFonts && Array.isArray(storedFonts)) { savedFonts = storedFonts; savedFonts.forEach(font => injectFontFace(font.name, font.data)); } }
            function resizeCanvas() { if (!canvas) return; const [logicalWidth, logicalHeight] = getCanvasLogicalSize(); const MAX_VISUAL_WIDTH = 854; const containerWidth = canvasWrapper.offsetWidth - 40; const containerHeight = canvasWrapper.offsetHeight - 140; /* Adjusted for notebook */ const aspectRatio = logicalWidth / logicalHeight; let visualWidth = Math.min(containerWidth, MAX_VISUAL_WIDTH); let visualHeight = visualWidth / aspectRatio; if (visualHeight > containerHeight) { visualHeight = containerHeight; visualWidth = visualHeight * aspectRatio; } canvas.setWidth(visualWidth).setHeight(visualHeight); canvas.setZoom(visualWidth / logicalWidth); canvas.renderAll(); }
            function getCanvasLogicalSize() { if (canvasSizeSelect.value === 'custom') return [parseInt(customWidthInput.value) || 1280, parseInt(customHeightInput.value) || 720]; return canvasSizeSelect.value.split('x').map(Number); }
            async function toBlob(dataURL) { const res = await fetch(dataURL); return await res.blob(); }
            async function generateImageForTargetSize(format, targetSizeKB) { const [logicalWidth, logicalHeight] = getCanvasLogicalSize(); const originalZoom = canvas.getZoom(); canvas.setZoom(1); canvas.setWidth(logicalWidth).setHeight(logicalHeight); canvas.renderAll(); const multiplier = 1; let dataURL; if (format === 'png') { dataURL = canvas.toDataURL({ format: 'png', multiplier }); } else { let minQuality = 0.1, maxQuality = 1.0; for (let i = 0; i < 7; i++) { const quality = (minQuality + maxQuality) / 2; dataURL = canvas.toDataURL({ format, quality, multiplier }); const blob = await toBlob(dataURL); if (blob.size > targetSizeKB * 1024) maxQuality = quality; else minQuality = quality; } } canvas.setZoom(originalZoom); resizeCanvas(); return dataURL; }
            function deleteSelectedObjects() { canvas.remove(...canvas.getActiveObjects()); canvas.discardActiveObject().renderAll(); }
            function updateProportionalCorners(obj, percent) { if (!obj || !obj.isType('rect')) return; const shorterScaledSide = Math.min(obj.getScaledWidth(), obj.getScaledHeight()); const visualRadius = (shorterScaledSide / 2) * (percent / 100); const newRx = visualRadius / (obj.scaleX || 1); const newRy = visualRadius / (obj.scaleY || 1); obj.set({ rx: newRx, ry: newRy, cornerPercent: percent }); }

            function updateUI() { updatePropertiesPanel(); updateLayerList(); }
            function updatePropertiesPanel() {
                const activeObj = canvas.getActiveObject();
                deleteBtnHeader.disabled = !activeObj;
                if (activeObj) {
                    propertiesPanelContent.classList.remove('hidden'); propertiesPlaceholder.classList.add('hidden'); const isText = activeObj.isType('textbox'); const isRect = activeObj.isType('rect'); textControls.classList.toggle('hidden', !isText); shapeControls.classList.toggle('hidden', !isRect); fillColorInput.value = activeObj.get('fill') || '#000000'; strokeColorInput.value = activeObj.get('stroke') || '#000000'; strokeWidthInput.value = activeObj.get('strokeWidth') || 0; opacityInput.value = activeObj.get('opacity') || 1; const shadow = activeObj.get('shadow'); shadowColorInput.value = shadow ? shadow.color : '#000000'; shadowBlurInput.value = shadow ? shadow.blur : 0; shadowOffsetXInput.value = shadow ? shadow.offsetX : 0; shadowOffsetYInput.value = shadow ? shadow.offsetY : 0; if (isText) { fontFamilySelect.value = activeObj.get('fontFamily'); fontSizeInput.value = activeObj.get('fontSize'); fontBoldBtn.classList.toggle('active', activeObj.get('fontWeight') === 'bold'); fontItalicBtn.classList.toggle('active', activeObj.get('fontStyle') === 'italic'); fontUnderlineBtn.classList.toggle('active', activeObj.get('underline')); lineHeightInput.value = activeObj.get('lineHeight'); charSpacingInput.value = activeObj.get('charSpacing'); document.querySelectorAll('#text-controls [id^="align-"]').forEach(b => b.classList.remove('active')); document.getElementById(`align-${activeObj.get('textAlign') || 'left'}`).classList.add('active'); }  else if (isRect) { cornerRadiusInput.value = activeObj.get('cornerPercent') || 0; }
                } else {
                    propertiesPanelContent.classList.add('hidden'); propertiesPlaceholder.classList.remove('hidden');
                }
            }
            function updateLayerList() {
                layerList.innerHTML = ''; const objects = canvas.getObjects(); objects.slice().reverse().forEach((obj) => { const indexInCanvas = objects.indexOf(obj); const item = document.createElement('li'); item.className = 'layer-item'; item.dataset.index = indexInCanvas; item.setAttribute('draggable', true); if (canvas.getActiveObject() === obj) item.classList.add('selected'); let name = 'Shape'; if (obj.isType('textbox')) { name = obj.text.substring(0, 15) || 'Text'; if (obj.text.length > 15) name += '...'; } else if (obj.isType('image') && obj.originalName) { name = obj.originalName.substring(0, 15); if (obj.originalName.length > 15) name += '...'; } else if (obj.isType('rect')) { name = 'Rectangle'; } else if (obj.isType('circle')) { name = 'Circle'; } item.innerHTML = `<span class="layer-name" data-index="${indexInCanvas}">${name}</span><div class="layer-actions"><div class="layer-ordering"><button class="layer-up-btn" data-index="${indexInCanvas}" title="Bring Forward">▲</button><button class="layer-down-btn" data-index="${indexInCanvas}" title="Send Backward">▼</button></div><button class="layer-lock-btn" data-index="${indexInCanvas}" title="Lock/Unlock"><i class="fas ${obj.selectable ? 'fa-unlock' : 'fa-lock'}"></i></button><button class="layer-visible-btn" data-index="${indexInCanvas}" title="Show/Hide"><i class="fas ${obj.visible ? 'fa-eye' : 'fa-eye-slash'}"></i></button></div>`; layerList.appendChild(item); });
            }
            
            layerList.addEventListener('click', e => { const target = e.target; const button = target.closest('button'); if (button) { e.stopPropagation(); const objectIndex = parseInt(button.dataset.index, 10); const targetObject = canvas.getObjects()[objectIndex]; if (!targetObject) return; if (button.classList.contains('layer-lock-btn')) { targetObject.set({ selectable: !targetObject.selectable, evented: !targetObject.evented }); updateLayerList(); } else if (button.classList.contains('layer-visible-btn')) { targetObject.set({ visible: !targetObject.visible }); } else if (button.classList.contains('layer-up-btn')) { canvas.bringForward(targetObject); } else if (button.classList.contains('layer-down-btn')) { canvas.sendBackwards(targetObject); } saveState(); canvas.renderAll(); } else if (target.classList.contains('layer-name')) { const objectIndex = parseInt(target.dataset.index, 10); canvas.setActiveObject(canvas.getObjects()[objectIndex]); canvas.renderAll(); } });

            function initializeCanvas() {
                if (canvas) canvas.dispose();
                const canvasEl = document.getElementById('thumbnail-canvas');
                canvas = new fabric.Canvas(canvasEl, { preserveObjectStacking: true, backgroundColor: canvasBgColorInput.value });
                canvas.on({ 'object:modified': saveState, 'object:added': saveState, 'object:removed': saveState, 'selection:created': updateUI, 'selection:updated': updateUI, 'selection:cleared': updateUI, 'object:scaling': (e) => { if (e.target.isType('rect')) { updateProportionalCorners(e.target, e.target.cornerPercent || 0); } } });
                fabric.Object.prototype.set({ uniScaleKey: 'shiftKey', cornerColor: '#007bff', cornerStyle: 'circle', transparentCorners: false, borderColor: '#007bff', borderWidth: 2 });
                resizeCanvas();
                saveState();
                updateUI();
            }
            
            function setupEventListeners() {
                window.addEventListener('keydown', e => { if (e.ctrlKey && e.key === 'z') undo(); if (e.ctrlKey && e.key === 'y') redo(); if (e.key === 'Delete') deleteSelectedObjects(); });
                window.addEventListener('resize', resizeCanvas);
                canvasSizeSelect.addEventListener('change', () => { customSizeInputs.classList.toggle('hidden', canvasSizeSelect.value !== 'custom'); resizeCanvas(); saveState(); });
                [customWidthInput, customHeightInput].forEach(el => el.addEventListener('input', resizeCanvas));
                canvasBgColorInput.addEventListener('input', e => { canvas.set('backgroundColor', e.target.value); render(); saveState(); });
                addTextBtn.addEventListener('click', () => canvas.add(new fabric.Textbox('New Text', { left: 50, top: 50, width: 400, fontSize: 80, fontFamily: fontFamilySelect.value || 'Arial', fill: '#eeeeee' })).setActiveObject(canvas.getObjects().pop()));
                addRectBtn.addEventListener('click', () => canvas.add(new fabric.Rect({ left: 100, top: 100, width: 250, height: 150, fill: '#007bff', cornerPercent: 0 })).setActiveObject(canvas.getObjects().pop()));
                addCircleBtn.addEventListener('click', () => canvas.add(new fabric.Circle({ left: 150, top: 150, radius: 75, fill: '#28a745' })).setActiveObject(canvas.getObjects().pop()));
                imageUpload.addEventListener('change', e => { const file = e.target.files[0]; if (!file) return; fabric.Image.fromURL(URL.createObjectURL(file), img => { img.set('originalName', file.name); img.scaleToWidth(300); canvas.add(img).setActiveObject(img).renderAll(); }); e.target.value = ''; });
                fontUpload.addEventListener('change', handleFontUpload);
                undoBtn.addEventListener('click', undo);
                redoBtn.addEventListener('click', redo);
                deleteBtnHeader.addEventListener('click', deleteSelectedObjects);
                fillColorInput.addEventListener('input', e => { updateProp('fill', e.target.value); render(); });
                fillColorInput.addEventListener('change', saveState);
                strokeColorInput.addEventListener('input', e => { updateProp('stroke', e.target.value); render(); });
                strokeColorInput.addEventListener('change', saveState);
                strokeWidthInput.addEventListener('input', e => { updateProp('strokeWidth', parseInt(e.target.value, 10)); render(); });
                strokeWidthInput.addEventListener('change', saveState);
                opacityInput.addEventListener('input', e => { updateProp('opacity', parseFloat(e.target.value)); render(); });
                opacityInput.addEventListener('change', saveState);
                const handleCornerRadiusChange = (e) => { const percent = parseInt(e.target.value, 10) || 0; canvas.getActiveObjects().forEach(obj => { updateProportionalCorners(obj, percent); }); render(); };
                cornerRadiusInput.addEventListener('input', handleCornerRadiusChange);
                cornerRadiusInput.addEventListener('change', saveState);
                fontFamilySelect.addEventListener('change', e => { updateProp('fontFamily', e.target.value); render(); saveState(); });
                fontSizeInput.addEventListener('change', e => { updateProp('fontSize', parseInt(e.target.value, 10)); render(); saveState(); });
                lineHeightInput.addEventListener('input', e => { updateProp('lineHeight', parseFloat(e.target.value)); render(); });
                lineHeightInput.addEventListener('change', saveState);
                charSpacingInput.addEventListener('input', e => { updateProp('charSpacing', parseInt(e.target.value, 10)); render(); });
                charSpacingInput.addEventListener('change', saveState);
                fontBoldBtn.addEventListener('click', () => { const isActive = fontBoldBtn.classList.toggle('active'); updateProp('fontWeight', isActive ? 'bold' : 'normal'); render(); saveState(); });
                fontItalicBtn.addEventListener('click', () => { const isActive = fontItalicBtn.classList.toggle('active'); updateProp('fontStyle', isActive ? 'italic' : 'normal'); render(); saveState(); });
                fontUnderlineBtn.addEventListener('click', () => { const isActive = fontUnderlineBtn.classList.toggle('active'); updateProp('underline', isActive); render(); saveState(); });
                alignLeftBtn.addEventListener('click', () => { updateProp('textAlign', 'left'); render(); updateUI(); saveState(); });
                alignCenterBtn.addEventListener('click', () => { updateProp('textAlign', 'center'); render(); updateUI(); saveState(); });
                alignRightBtn.addEventListener('click', () => { updateProp('textAlign', 'right'); render(); updateUI(); saveState(); });
                const updateShadow = () => { const shadow = { color: shadowColorInput.value, blur: parseInt(shadowBlurInput.value, 10), offsetX: parseInt(shadowOffsetXInput.value, 10), offsetY: parseInt(shadowOffsetYInput.value, 10), affectStroke: true }; const hasShadow = shadow.blur > 0 || shadow.offsetX !== 0 || shadow.offsetY !== 0; updateProp('shadow', hasShadow ? new fabric.Shadow(shadow) : null); render(); };
                [shadowColorInput, shadowBlurInput, shadowOffsetXInput, shadowOffsetYInput].forEach(el => { el.addEventListener('input', updateShadow); el.addEventListener('change', saveState); });
                openDownloadModalBtn.addEventListener('click', () => { previewImg.src = canvas.toDataURL({multiplier: 1}); downloadModal.classList.remove('hidden'); });
                modalCloseBtn.addEventListener('click', () => downloadModal.classList.add('hidden'));
                formatSelect.addEventListener('change', () => sizeControl.classList.toggle('hidden', formatSelect.value === 'png'));
                finalDownloadBtn.addEventListener('click', async () => {
                    showLoader("Generating Image...");
                    const dataURL = await generateImageForTargetSize(formatSelect.value, parseInt(targetSizeInput.value, 10));
                    const link = document.createElement('a');
                    link.href = dataURL;
                    // UPDATED: Filename now includes timestamp
                    link.download = `VACANCYHA_ONLINE_${Date.now()}.${formatSelect.value}`;
                    link.click();
                    hideLoader();
                    downloadModal.classList.add('hidden');
                });
                layerList.addEventListener('dragstart', e => { if (e.target.classList.contains('layer-item')) { draggedItem = e.target; setTimeout(() => e.target.classList.add('dragging'), 0); } });
                layerList.addEventListener('dragend', e => { if (draggedItem) { draggedItem.classList.remove('dragging'); draggedItem = null; } });
                layerList.addEventListener('dragover', e => { e.preventDefault(); const afterElement = getDragAfterElement(layerList, e.clientY); const currentlyDragged = document.querySelector('.dragging'); if (afterElement == null) { layerList.appendChild(currentlyDragged); } else { layerList.insertBefore(currentlyDragged, afterElement); } });
                layerList.addEventListener('drop', e => { e.preventDefault(); if (!draggedItem) return; const newOrderIds = [...layerList.querySelectorAll('.layer-item')].map(item => parseInt(item.dataset.index, 10)).reverse(); const currentObjects = canvas.getObjects(); newOrderIds.forEach((id, newIndex) => { const objectToMove = currentObjects.find(obj => currentObjects.indexOf(obj) === id); canvas.moveTo(objectToMove, newIndex); }); saveState(); canvas.renderAll(); });
                function getDragAfterElement(container, y) { const draggableElements = [...container.querySelectorAll('.layer-item:not(.dragging)')]; return draggableElements.reduce((closest, child) => { const box = child.getBoundingClientRect(); const offset = y - box.top - box.height / 2; if (offset < 0 && offset > closest.offset) { return { offset: offset, element: child }; } else { return closest; } }, { offset: Number.NEGATIVE_INFINITY }).element; }
            }

            function applyTheme(theme) { document.body.className = theme; }
            themeToggle.addEventListener('change', () => { const theme = themeToggle.checked ? 'dark-theme' : ''; applyTheme(theme); localStorage.setItem('thumbnailMakerTheme', theme); });

            (function init() {
                Object.entries(CANVAS_RESOLUTIONS).forEach(([value, text]) => canvasSizeSelect.add(new Option(text, value)));
                canvasSizeSelect.value = "1280x720";
                const savedTheme = localStorage.getItem('thumbnailMakerTheme') || '';
                themeToggle.checked = savedTheme === 'dark-theme';
                applyTheme(savedTheme);
                loadSavedFonts();
                updateFontDropdown();
                initializeCanvas();
                setupEventListeners();
            })();
        });
    </script>
</body>
</html>
